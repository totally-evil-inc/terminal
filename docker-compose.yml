services:
  app:
    image: terminal-app:dev
    build:
      context: .
      target: dev
    container_name: terminal-api
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      AUTH_SERVER_URL: ${DOCKER_AUTH_SERVER_URL:-http://host.docker.internal:4000/}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-terminal}:${POSTGRES_PASSWORD:-terminal}@postgres:5432/${POSTGRES_DB:-terminal}?sslmode=disable
      GOCACHE: /app/.cache/go-build
      GOMODCACHE: /app/.cache/go-mod
      REDIS_ADDR: redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    networks:
      - backend-net
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: terminal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terminal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terminal}
      POSTGRES_DB: ${POSTGRES_DB:-terminal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend-net
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: terminal-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - backend-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  backend-net:
    driver: bridge

volumes:
  pgdata:
  redis_data:
